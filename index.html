<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Missão Aura</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Missão Aura</h1>

        <p>Descubra qual perfil combina com você.</p>

        <form id="formulario">

            <label>Nome:</label>
            <input type="text" id="nome">

            <label>Data de nascimento:</label>
            <input type="date" id="nascimento">


            <h3>1. O que você prefere fazer?</h3>

            <label>
                <input type="radio" name="pergunta1" value="engenheiro">
                Construir e consertar coisas
            </label>

            <label>
                <input type="radio" name="pergunta1" value="cientista">
                Pesquisar e descobrir coisas
            </label>

            <label>
                <input type="radio" name="pergunta1" value="explorador">
                Explorar lugares novos
            </label>

            <label>
                <input type="radio" name="pergunta1" value="estrategista">
                Organizar e planejar
            </label>


            <h3>2. Qual atividade parece mais interessante?</h3>

            <label>
                <input type="radio" name="pergunta2" value="engenheiro">
                Resolver problemas
            </label>

            <label>
                <input type="radio" name="pergunta2" value="cientista">
                Fazer pesquisas
            </label>

            <label>
                <input type="radio" name="pergunta2" value="explorador">
                Conhecer lugares diferentes
            </label>

            <label>
                <input type="radio" name="pergunta2" value="estrategista">
                Organizar uma missão
            </label>


            <h3>3. Quando encontra algo desconhecido, você:</h3>

            <label>
                <input type="radio" name="pergunta3" value="engenheiro">
                Tenta descobrir como funciona
            </label>

            <label>
                <input type="radio" name="pergunta3" value="cientista">
                Analisa antes de agir
            </label>

            <label>
                <input type="radio" name="pergunta3" value="explorador">
                Vai investigar
            </label>

            <label>
                <input type="radio" name="pergunta3" value="estrategista">
                Faz um plano primeiro
            </label>


            <h3>4. Qual característica combina mais com você?</h3>

            <label>
                <input type="radio" name="pergunta4" value="engenheiro">
                Criatividade
            </label>

            <label>
                <input type="radio" name="pergunta4" value="cientista">
                Curiosidade
            </label>

            <label>
                <input type="radio" name="pergunta4" value="explorador">
                Coragem
            </label>

            <label>
                <input type="radio" name="pergunta4" value="estrategista">
                Organização
            </label>


            <button type="submit">Descobrir perfil</button>

        </form>


        <div id="resultado"></div>

    </div>


    <script src="script js/script.js"></script>

</body>

</html>
